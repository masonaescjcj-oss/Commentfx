<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where a 12% trailing allowance becomes less room than an 8% static one</title>
<desc id="d">On a $100,000 account, an 8% static floor stays at $92,000. A 12% intraday trailing floor starts lower, at $88,000, and rises one dollar for every dollar the account runs up, banked or not. The two cross at a $4,000 run-up; after a $5,000 spike the trailing floor is at $93,000, above the static one, and it never comes back down.</desc>
<rect width="660" height="460" fill="#081228"/>
<line x1="100" x2="564" y1="351.6" y2="351.6" stroke="#17223A" stroke-width="1"/><line x1="100" x2="564" y1="294.8" y2="294.8" stroke="#17223A" stroke-width="1"/><line x1="100" x2="564" y1="238.0" y2="238.0" stroke="#17223A" stroke-width="1"/><line x1="100" x2="564" y1="181.2" y2="181.2" stroke="#17223A" stroke-width="1"/><line x1="100" x2="564" y1="124.4" y2="124.4" stroke="#17223A" stroke-width="1"/>
<line x1="100" x2="564" y1="380" y2="380" stroke="#2A3650" stroke-width="1"/>
<text x="90.0" y="351.6" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$88,000</text><text x="90.0" y="294.8" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$90,000</text><text x="90.0" y="238.0" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$92,000</text><text x="90.0" y="181.2" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$94,000</text><text x="90.0" y="124.4" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$96,000</text>
<text x="100.0" y="402.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$0</text><text x="216.0" y="402.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$2,000</text><text x="332.0" y="402.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$4,000</text><text x="448.0" y="402.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$6,000</text><text x="564.0" y="402.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#93A0B6" style="font-variant-numeric:tabular-nums">$8,000</text>
<text x="332.0" y="436.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#93A0B6">How far the account ran up first, banked or not</text>
<polygon points="332.0,238.0 564.0,238.0 564.0,124.4" fill="#199e70" fill-opacity="0.13"/>
<line x1="100.0" y1="238.0" x2="564.0" y2="238.0" stroke="#3987e5" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100.0" y1="351.6" x2="564.0" y2="124.4" stroke="#199e70" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="332.0" cy="238.0" r="7.5" fill="#081228"/><circle cx="332.0" cy="238.0" r="5" fill="#EEF2F8"/>
<circle cx="390.0" cy="209.6" r="7.5" fill="#081228"/><circle cx="390.0" cy="209.6" r="5" fill="#199e70"/>
<text x="320.0" y="216.0" text-anchor="end" dominant-baseline="middle" font-size="18" fill="#EEF2F8">They cross at a $4,000 run-up</text>
<text x="376.0" y="189.7" text-anchor="end" dominant-baseline="middle" font-size="18" fill="#EEF2F8">$5,000 spike: $93,000</text>
<text x="111.6" y="373.6" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#C3CCDC">12% trailing starts at $88,000</text>
<text x="561.1" y="201.1" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#C3CCDC">Less room</text><text x="561.1" y="221.0" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#C3CCDC">than 8% static</text>
<line x1="20" x2="44" y1="30" y2="30" stroke="#3987e5" stroke-width="3.5" stroke-linecap="round"/><text x="52.0" y="30.0" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#C3CCDC">8% static floor</text>
<line x1="212" x2="236" y1="30" y2="30" stroke="#199e70" stroke-width="3.5" stroke-linecap="round"/><text x="244.0" y="30.0" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#C3CCDC">12% intraday trailing floor</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="660" height="510" viewBox="0 0 660 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">One account, three drawdown rules, over three days</title>
<desc id="d">A $100,000 account with an $8,000 maximum loss rises to $105,000 during day one and closes at $101,000, then loses $3,500 on each of days two and three to finish at $94,000. The static floor stays at $92,000 and the account survives with $2,000 to spare. The end-of-day trailing floor rises to $93,000 on the day-one close and the account survives with $1,000 to spare. The intraday trailing floor follows the unrealised peak up to $97,000, and the balance reaches it $500 into day three, ending that account.</desc>

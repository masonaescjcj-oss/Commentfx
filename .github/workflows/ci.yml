name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The build reaches free APIs for market data. Every one of those calls is
      # allowed to fail -- the pages render an honest "unavailable" state -- so a
      # rate-limited upstream must not be able to redden a pull request. What is
      # being checked here is that every page still builds.
      - name: Build
        run: pnpm build

      # A palette that looks restrained on a designer's monitor can be
      # unreadable on a phone outdoors. The first run of this found twenty
      # distinct failing colour pairs, body text among them at 2.2:1, so it
      # runs on every push rather than when someone remembers.
      - name: Install the browser the audit needs
        # Through the workspace, not npx: playwright is a devDependency of
        # apps/web and pnpm does not hoist it to the root, so a bare `npx
        # playwright` at the repo root finds nothing.
        run: pnpm --filter @commentfx/web exec playwright install --with-deps chromium

      - name: Accessibility audit
        shell: bash
        run: |
          pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          AUDIT_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web audit:a11y

      # Again at a desktop width, because that is different markup and not a
      # wider copy of the same: the header swaps its menu for an inline nav, and
      # four page shapes become two columns. A pass at 390px says nothing about
      # any of it. Reuses the server the run above left on 3000.
      - name: Accessibility audit, desktop
        run: AUDIT_WIDTH=1440 AUDIT_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web audit:a11y

      # The header is two colour schemes, not one: blue with white type while it
      # is standing on the blue band, white with ink and the brand blue once the
      # band has scrolled away. The runs above only ever see the first. This one
      # sees the second, and it caught a deliberately broken --hdr-ink-2 on 13
      # pages that neither of the others noticed at all.
      - name: Accessibility audit, scrolled
        run: AUDIT_SCROLL=900 AUDIT_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web audit:a11y

      - name: Accessibility audit, scrolled, desktop
        run: AUDIT_SCROLL=900 AUDIT_WIDTH=1440 AUDIT_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web audit:a11y

      # The sitemap is generated from the data rather than hand-maintained, which
      # makes it feel self-maintaining and is why nobody looked at it: it was
      # missing every coin page. Reuses the server the audit left on 3000.
      - name: Sitemap
        run: CHECK_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web check:seo

      # The site's own search. It had never been driven by anything and was
      # missing a hundred pages. The coverage block in it is the check that
      # would have caught that: one query per kind of page the site publishes.
      - name: Search
        run: SMOKE_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web smoke:search

      # Layout stability on Chrome's Slow 4G with a 4x CPU throttle. Six page
      # shapes were over Google's 0.1 and nothing would have said so: it is a
      # defect you can only see by measuring, because it happens a second in
      # and leaves no trace.
      - name: Layout stability
        run: CHECK_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web check:vitals

      # And at a desktop width, where several pages are two columns: different
      # geometry, so different things can move.
      - name: Layout stability, desktop
        run: CHECK_WIDTH=1440 CHECK_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web check:vitals

      # Writing flows, through the real forms, against a real database. This is
      # the only check that could have caught either of the two worst bugs this
      # project has had: publishing a review 404ing the broker's page, and two
      # database handles making every write invisible to every page. Both were
      # green in the unit suite.
      #
      # The database is seeded fresh and handed only to `start`, never to
      # `build` — Next prerenders in parallel workers and a file-backed PGlite
      # is single-process.
      - name: Writing flows
        shell: bash
        env:
          PGLITE_DIR: ${{ github.workspace }}/.pglite-ci
          REPORT_HASH_SECRET: ci-fixed-secret-so-dedupe-is-deterministic
        # Its own port: the audit above leaves a server on 3000, and that one
        # has no database.
        run: |
          node --experimental-strip-types packages/db/src/seed.ts
          PORT=3001 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3001/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3001 pnpm --filter @commentfx/web smoke

      # The editor's side. The whole product rests on one claim — a number
      # counts only once a person checked it — and that claim is only as good
      # as the screen the person uses. Until this existed, verify and hide had
      # been exercised at the database layer and nowhere else.
      - name: Editor flows
        shell: bash
        env:
          PGLITE_DIR: ${{ github.workspace }}/.pglite-admin-ci
          REPORT_HASH_SECRET: ci-fixed-secret-so-dedupe-is-deterministic
          ADMIN_TOKEN: ci-admin-token
        run: |
          node --experimental-strip-types packages/db/src/seed.ts
          PORT=3002 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3002/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3002 SMOKE_ADMIN_TOKEN=ci-admin-token \
            pnpm --filter @commentfx/web smoke:admin

  # What the site looks like when the free APIs it does not pay for go quiet.
  #
  # Its own job, because the point is a build made while they are unreachable.
  # Next caches a successful fetch for the revalidate window and prerenders the
  # top coins, so a site built against a working network keeps serving real
  # prices through the first minutes of an outage — correct, and the reason a
  # check run against that build proves nothing. Broken first, every page has to
  # render live against nothing.
  #
  # This was not a theoretical exercise. /coins/[slug] called notFound()
  # whenever CoinGecko did not answer, and a free tier not answering is a
  # Tuesday: every coin page on the site went to 404, Bitcoin's included.
  degraded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # At the host level, the way an outage breaks them, so no product code
      # has a test-only branch in it. smoke:degraded asserts these are really
      # unreachable before it asserts anything else.
      - name: Take every upstream away
        run: |
          sudo tee -a /etc/hosts <<'EOF'
          127.0.0.1 api.coingecko.com
          127.0.0.1 api.geckoterminal.com
          127.0.0.1 api.gopluslabs.io
          127.0.0.1 www.bls.gov
          127.0.0.1 www.federalreserve.gov
          127.0.0.1 www.ecb.europa.eu
          127.0.0.1 www.coindesk.com
          127.0.0.1 decrypt.co
          127.0.0.1 www.theblock.co
          127.0.0.1 cointelegraph.com
          EOF

      # The build must not start from a cache that was filled while the network
      # worked: Next keeps successful fetches in .next/cache/fetch-cache across
      # builds, and a run that serves those is a degradation test that proves
      # nothing. On a fresh runner there is none, and deleting it costs nothing;
      # the reason it is written down is that it cost an hour locally, where
      # there is one.
      - name: Build without them
        run: |
          rm -rf apps/web/.next
          pnpm build

      - run: pnpm --filter @commentfx/web exec playwright install --with-deps chromium

      - name: Degraded flows
        shell: bash
        run: |
          PORT=3003 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3003/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3003 pnpm --filter @commentfx/web smoke:degraded

      # These pages carry copy that no other run renders — unavailable cards,
      # source-down notices — so this is the only place axe ever sees it.
      - name: Accessibility of the degraded pages
        run: AUDIT_BASE=http://127.0.0.1:3003 AUDIT_PAGES=/,/coins,/coins/bitcoin,/memecoins,/calendar,/calendar/us-jobs-report pnpm --filter @commentfx/web audit:a11y

      # And the sitemap does not shrink because an upstream was quiet when it
      # regenerated. It is built from checked-in data for exactly this reason,
      # and every URL in it still has to serve.
      - name: Sitemap holds up without them
        run: CHECK_BASE=http://127.0.0.1:3003 pnpm --filter @commentfx/web check:seo

  # The production database path, against a real Postgres.
  #
  # It had never been run. Everything in the job above uses PGlite, which is what
  # a developer gets, and the two branches of makeDb() are not the same code: the
  # embedded one applied its migrations on connect and the Postgres one did not.
  # A deployment with DATABASE_URL set installed cleanly, built cleanly, served
  # every read-only page, and answered the first write with `relation
  # "regulators" does not exist`. Nothing could have caught that except pointing
  # at a real server, so now something does, on every push.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      REPORT_HASH_SECRET: ci-fixed-secret-so-dedupe-is-deterministic
      ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No DATABASE_URL here on purpose: Next prerenders in parallel workers, and
      # the build has no business writing to the production database anyway.
      - name: Build
        env:
          DATABASE_URL: ''
        run: pnpm build

      - run: pnpm --filter @commentfx/web exec playwright install --with-deps chromium

      # The schema is created by the app itself on its first connection. Seeding
      # without a migrate step first is the assertion: if that ever stops
      # happening, this line fails with the error the deploy would have given.
      - name: Seed, which is also the migration test
        run: node --experimental-strip-types packages/db/src/seed.ts

      - name: Writing and editor flows on Postgres
        shell: bash
        run: |
          PORT=3005 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3005/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3005 pnpm --filter @commentfx/web smoke
          SMOKE_BASE=http://127.0.0.1:3005 SMOKE_ADMIN_TOKEN=ci-admin-token \
            pnpm --filter @commentfx/web smoke:admin

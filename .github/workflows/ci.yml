name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The build reaches free APIs for market data. Every one of those calls is
      # allowed to fail -- the pages render an honest "unavailable" state -- so a
      # rate-limited upstream must not be able to redden a pull request. What is
      # being checked here is that every page still builds.
      - name: Build
        run: pnpm build

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The build reaches free APIs for market data. Every one of those calls is
      # allowed to fail -- the pages render an honest "unavailable" state -- so a
      # rate-limited upstream must not be able to redden a pull request. What is
      # being checked here is that every page still builds.
      - name: Build
        run: pnpm build

      # A palette that looks restrained on a designer's monitor can be
      # unreadable on a phone outdoors. The first run of this found twenty
      # distinct failing colour pairs, body text among them at 2.2:1, so it
      # runs on every push rather than when someone remembers.
      - name: Install the browser the audit needs
        # Through the workspace, not npx: playwright is a devDependency of
        # apps/web and pnpm does not hoist it to the root, so a bare `npx
        # playwright` at the repo root finds nothing.
        run: pnpm --filter @commentfx/web exec playwright install --with-deps chromium

      - name: Accessibility audit
        shell: bash
        run: |
          pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          AUDIT_BASE=http://127.0.0.1:3000 pnpm --filter @commentfx/web audit:a11y

      # Writing flows, through the real forms, against a real database. This is
      # the only check that could have caught either of the two worst bugs this
      # project has had: publishing a review 404ing the broker's page, and two
      # database handles making every write invisible to every page. Both were
      # green in the unit suite.
      #
      # The database is seeded fresh and handed only to `start`, never to
      # `build` — Next prerenders in parallel workers and a file-backed PGlite
      # is single-process.
      - name: Writing flows
        shell: bash
        env:
          PGLITE_DIR: ${{ github.workspace }}/.pglite-ci
          REPORT_HASH_SECRET: ci-fixed-secret-so-dedupe-is-deterministic
        # Its own port: the audit above leaves a server on 3000, and that one
        # has no database.
        run: |
          node --experimental-strip-types packages/db/src/seed.ts
          PORT=3001 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3001/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3001 pnpm --filter @commentfx/web smoke

      # The editor's side. The whole product rests on one claim — a number
      # counts only once a person checked it — and that claim is only as good
      # as the screen the person uses. Until this existed, verify and hide had
      # been exercised at the database layer and nowhere else.
      - name: Editor flows
        shell: bash
        env:
          PGLITE_DIR: ${{ github.workspace }}/.pglite-admin-ci
          REPORT_HASH_SECRET: ci-fixed-secret-so-dedupe-is-deterministic
          ADMIN_TOKEN: ci-admin-token
        run: |
          node --experimental-strip-types packages/db/src/seed.ts
          PORT=3002 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3002/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3002 SMOKE_ADMIN_TOKEN=ci-admin-token \
            pnpm --filter @commentfx/web smoke:admin

  # What the site looks like when the free APIs it does not pay for go quiet.
  #
  # Its own job, because the point is a build made while they are unreachable.
  # Next caches a successful fetch for the revalidate window and prerenders the
  # top coins, so a site built against a working network keeps serving real
  # prices through the first minutes of an outage — correct, and the reason a
  # check run against that build proves nothing. Broken first, every page has to
  # render live against nothing.
  #
  # This was not a theoretical exercise. /coins/[slug] called notFound()
  # whenever CoinGecko did not answer, and a free tier not answering is a
  # Tuesday: every coin page on the site went to 404, Bitcoin's included.
  degraded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # At the host level, the way an outage breaks them, so no product code
      # has a test-only branch in it. smoke:degraded asserts these are really
      # unreachable before it asserts anything else.
      - name: Take every upstream away
        run: |
          sudo tee -a /etc/hosts <<'EOF'
          127.0.0.1 api.coingecko.com
          127.0.0.1 api.geckoterminal.com
          127.0.0.1 api.gopluslabs.io
          127.0.0.1 www.bls.gov
          127.0.0.1 www.federalreserve.gov
          127.0.0.1 www.ecb.europa.eu
          EOF

      - name: Build without them
        run: pnpm build

      - run: pnpm --filter @commentfx/web exec playwright install --with-deps chromium

      - name: Degraded flows
        shell: bash
        run: |
          PORT=3003 pnpm --filter @commentfx/web start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3003/ && break
            sleep 1
          done
          SMOKE_BASE=http://127.0.0.1:3003 pnpm --filter @commentfx/web smoke:degraded

      # These pages carry copy that no other run renders — unavailable cards,
      # source-down notices — so this is the only place axe ever sees it.
      - name: Accessibility of the degraded pages
        run: AUDIT_BASE=http://127.0.0.1:3003 AUDIT_PAGES=/coins,/coins/bitcoin,/memecoins,/calendar,/calendar/us-jobs-report pnpm --filter @commentfx/web audit:a11y
